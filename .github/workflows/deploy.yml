name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Lets you re-deploy by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it; queue any newer push behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Project site lives at https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      # Requires Pages to already be enabled with Source = "GitHub Actions"
      # (Settings → Pages). The workflow's GITHUB_TOKEN cannot turn Pages on
      # itself — creating the Pages site needs repo-admin scope, which it
      # deliberately does not have.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
