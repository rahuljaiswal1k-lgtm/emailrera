<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Yellow layered skyscraper mark (short tower + chevron-striped mid tower + tall right tower) -->
  <g fill="#FFDA4B">
    <!-- Short left tower with two windows -->
    <path d="M14 34 L14 76 L34 76 L34 22 Z"/>
    <rect x="19" y="30" width="6" height="6" fill="#FFFFFF"/>
    <rect x="26" y="30" width="6" height="6" fill="#FFFFFF"/>
    <rect x="19" y="40" width="6" height="6" fill="#FFFFFF"/>
    <rect x="26" y="40" width="6" height="6" fill="#FFFFFF"/>
    <!-- Chevron-striped mid tower -->
    <path d="M38 12 L60 22 L60 76 L38 76 Z"/>
    <path d="M38 26 L60 34 L60 40 L38 32 Z" fill="#FFFFFF"/>
    <path d="M38 44 L60 52 L60 58 L38 50 Z" fill="#FFFFFF"/>
    <path d="M38 62 L60 70 L60 76 L38 68 Z" fill="#FFFFFF"/>
    <!-- Tall right tower with a subtle right edge -->
    <path d="M64 4 L86 16 L86 76 L64 76 Z"/>
  </g>
  <!-- Small house windows on the ground line -->
  <g fill="#FFDA4B">
    <rect x="45" y="82" width="5" height="5"/>
    <rect x="52" y="82" width="5" height="5"/>
  </g>
  <!-- Black double swoosh underneath -->
  <path d="M6 94 Q 50 100 94 92" stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M14 98 Q 50 102 88 96" stroke="#111111" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
